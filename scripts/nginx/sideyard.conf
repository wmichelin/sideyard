# Replace __CLUBDUE_PORT__ with clubdue-current's loopback port before installing.
# The deployment workflow manages the single proxy_pass in this file.
server {
    listen 80;
    server_name getsideyard.com clubdue.michelindigitalmedia.com www.getsideyard.com sideyard.work www.sideyard.work;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sideyard-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name getsideyard.com clubdue.michelindigitalmedia.com;
    ssl_certificate /etc/letsencrypt/live/getsideyard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getsideyard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:__CLUBDUE_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_timeout 110s; # sideyard-request-envelope
        proxy_send_timeout 110s; # sideyard-request-envelope
        proxy_read_timeout 110s; # sideyard-request-envelope
        send_timeout 110s; # sideyard-request-envelope
    }
}

server {
    listen 443 ssl;
    server_name www.getsideyard.com sideyard.work www.sideyard.work;
    ssl_certificate /etc/letsencrypt/live/getsideyard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getsideyard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://getsideyard.com$request_uri;
}
