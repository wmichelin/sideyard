<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — ClubDue</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Maintenance agreements</p>
    <h1 class="title">ClubDue</h1>
    {{ if .Demo }}
    <p class="subtitle">Demo mode — no database configured. Continue to the sample dashboard.</p>
    <a href="/" class="primary-btn full-width">Enter demo</a>
    {{ else }}
    <p class="subtitle">Sign in to your shop.</p>
    {{ if .Error }}<p class="error-banner">{{ .Error }}</p>{{ end }}
    <form method="post" action="/login" class="form-stack">
      {{ template "csrf_field" . }}
      <label>
        <span>Email</span>
        <input type="email" name="email" value="{{ .Email }}" required autocomplete="username">
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="primary-btn full-width">Sign in</button>
    </form>
    <p class="auth-footer"><a href="/signup">Create a shop account</a></p>
    {{ end }}
  </div>
</body>
</html>
