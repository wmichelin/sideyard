name: Pick up ClubDue issues

on:
  issues:
    types: [opened, labeled, reopened]

concurrency:
  group: clubdue-issue-pickup
  cancel-in-progress: false

jobs:
  wake-agent:
    # This job runs on the private G5 runner and executes only the fixed queue
    # tick. Issue text is never interpolated into a shell command.
    if: github.event.issue.state == 'open'
    runs-on: [self-hosted, linux, x64, clubdue]
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Report event received
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
        run: |
          LABEL_TEXT=""
          if [ -n "$EVENT_LABEL" ]; then LABEL_TEXT=", label: $EVENT_LABEL"; fi
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "🤖 ClubDue automation received this issue event (action: ${EVENT_ACTION}${LABEL_TEXT}). The G5 runner is checking the queue now."
      - name: Ensure issue is queued
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Issues created outside the repository forms may have no labels.
          # Every new/reopened issue must still enter the queue.
          gh issue edit "$ISSUE_NUMBER" --repo "${{ github.repository }}" --add-label agent-ready
      - name: Wake ClubDue agent queue
        run: /home/wmichelin/assistant/bin/clubdue-loop tick
