name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Match the Docker build stage so formatting, vetting, tests, and the
    # static build use the same pinned Go toolchain as the release artifact.
    container: golang:1.23-alpine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clubdue_test
          POSTGRES_USER: clubdue
          POSTGRES_PASSWORD: clubdue
        options: >-
          --health-cmd "pg_isready -U clubdue -d clubdue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"
          test -z "$unformatted"

      - name: Vet
        run: go vet ./...

      - name: Postgres integration tests
        env:
          DATABASE_URL: postgres://clubdue:clubdue@postgres:5432/clubdue_test?sslmode=disable
          CLUBDUE_REQUIRE_POSTGRES_INTEGRATION: "1"
        run: >-
          go test -count=1 -v -run
          '^(TestAgreementReferencesStayWithinShopAndCustomer|TestAgreementKeepsPlanTermsSnapshotAfterTemplateEdit|TestSignupEmailCannotCreateMultipleTenantIdentities|TestRetireLegacySharedDemoIsNarrowAndIdempotent|TestGenerateRenewalTasksCreatesCycleAwareMilestonesIdempotently|TestRenewedTaskRollsAgreementAndRetiresCycle|TestQueueRenewalDigestsIsDailyAndIdempotent|TestCompletedVisitCannotExceedAgreementEntitlement|TestRecurringServiceOccurrencesAreIdempotentTenantScopedAndFinal|TestGlobalMaintenanceSkipsPublicDemoSandboxes|TestProductionPublicDemoRouteIsExplicitIsolatedAndWritable|TestPublicDemoFixtureContract|TestPublicDemoHydratesRealisticLandscapingBook|TestPublicDemoSeasonalHistoryFollowsCalendar|TestPublicDemoConcurrentHydrationStaysWithinAdmissionBudget|TestPublicDemoCreatesIsolatedExpiringFictionalTenants|TestPublicDemoLogoutSurvivesExhaustedPreParseLimiter|TestPublicDemoImportPreviewStoreEnforcesExpiryIsolationAndBudgets|TestPublicDemoCSVPreviewCommitIsBoundedSingleUseAndIsolated|TestPublicDemoWorstCaseDailyImportMaterializesWithinRequestBudget|TestLandscapingSheetsImportCreatesIdempotentRecurringWork)$'
          ./...

      - name: Full test suite
        env:
          DATABASE_URL: postgres://clubdue:clubdue@postgres:5432/clubdue_test?sslmode=disable
          CLUBDUE_REQUIRE_POSTGRES_INTEGRATION: "1"
        run: go test -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/clubdue ./cmd/clubdue

  production-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform recovery identity contract
        run: |
          terraform -chdir=infra/azure/environments fmt -check
          terraform -chdir=infra/azure/environments init -backend=false -input=false
          terraform -chdir=infra/azure/environments validate
          terraform -chdir=infra/azure/environments test

      - name: Production-mode backup and restore rehearsal
        run: ./scripts/production-rehearsal.sh

      - name: Azure backup integrity and monitor checks
        run: |
          python3 scripts/azure/test-backup-store.py
          python3 scripts/azure/test-logical-backup-store.py
          python3 scripts/azure/test-backup-monitor.py
          python3 scripts/azure/test-recovery-identity.py

  sqlserver-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SQL Server connection and migration rehearsal
        run: ./scripts/sqlserver-rehearsal.sh

  pilot-onboarding-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pilot onboarding CSV rehearsal
        run: ./scripts/pilot-onboarding-rehearsal.sh
