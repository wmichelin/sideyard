name: Deploy Staging

# Every merge to main ships to staging automatically. Production is manual after review.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wmichelin/clubdue:staging
            ghcr.io/wmichelin/clubdue:${{ github.sha }}

      - name: Record immutable staging artifact
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not produce a valid immutable image digest" >&2
            exit 1
          fi
          image_ref="ghcr.io/wmichelin/clubdue@${IMAGE_DIGEST}"
          {
            echo "### Staging build artifact"
            echo
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Immutable image: \`${image_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONTAINER: clubdue-staging
          IMAGE: ghcr.io/wmichelin/clubdue@${{ steps.build.outputs.digest }}
          PORT: "8082"
          DOMAIN: clubdue-staging.michelindigitalmedia.com
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: CONTAINER,IMAGE,PORT,DOMAIN,GHCR_USER,GHCR_TOKEN
          # droplet-deploy.sh is a complete Bash program. ssh-action's
          # per-line stop wrapper breaks Bash case statements, while the
          # script's own `set -euo pipefail` provides the fail-fast contract.
          script_stop: false
          script_path: scripts/droplet-deploy.sh

      - name: Smoke test staging
        id: smoke
        continue-on-error: true
        run: ./scripts/smoke-test.sh staging

      - name: Roll back staging after a failed smoke test
        if: ${{ steps.smoke.outcome == 'failure' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONTAINER: clubdue-staging
          PORT: "8082"
          DOMAIN: clubdue-staging.michelindigitalmedia.com
          CLUBDUE_DEPLOY_MODE: rollback
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: CONTAINER,PORT,DOMAIN,CLUBDUE_DEPLOY_MODE
          script_stop: false
          script_path: scripts/droplet-deploy.sh

      - name: Fail deployment after rollback
        if: ${{ always() && steps.smoke.outcome == 'failure' }}
        run: exit 1
