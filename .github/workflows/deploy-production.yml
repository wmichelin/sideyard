name: Deploy Production

# Promote a tested staging image to production. Run only after staging review.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Promotion deploys a reviewed image; rollback restores the retained previous app release"
        required: true
        default: promote
        type: choice
        options:
          - promote
          - rollback
      image_digest:
        description: "Immutable sha256 digest of the exact staging-reviewed GHCR image (required for promotion)"
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch is not itself approval. Autonomous work leaves this
    # repository variable unset/false, so an accidental dispatch is harmless.
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment request
        id: request
        env:
          MODE: ${{ inputs.mode }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          case "$MODE" in
            promote)
              if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "image_digest must be an immutable sha256 digest (sha256: followed by 64 lowercase hexadecimal characters)" >&2
                exit 1
              fi
              echo "ref=ghcr.io/wmichelin/clubdue@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
              ;;
            rollback)
              if [[ -n "$IMAGE_DIGEST" ]]; then
                echo "image_digest is not accepted for rollback" >&2
                exit 1
              fi
              ;;
            *)
              echo "mode must be promote or rollback" >&2
              exit 1
              ;;
          esac

      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.mode == 'promote' }}

      - name: Log in to GHCR
        if: ${{ inputs.mode == 'promote' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Promote reviewed image to latest
        if: ${{ inputs.mode == 'promote' }}
        run: |
          SRC="${{ steps.request.outputs.ref }}"
          docker pull "$SRC"
          docker tag "$SRC" ghcr.io/wmichelin/clubdue:latest
          docker push ghcr.io/wmichelin/clubdue:latest

      - name: Record deployment action
        run: |
          {
            echo "### Production deployment"
            echo
            echo "- Mode: \`${{ inputs.mode }}\`"
            if [[ "${{ inputs.mode }}" == "promote" ]]; then
              echo "- Reviewed image: \`${{ steps.request.outputs.ref }}\`"
            else
              echo "- Restored release: retained \`clubdue-previous\` app container"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONTAINER: clubdue
          IMAGE: ${{ steps.request.outputs.ref }}
          PORT: "8083"
          DOMAIN: clubdue.michelindigitalmedia.com
          CLUBDUE_DEPLOY_MODE: ${{ inputs.mode }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: CONTAINER,IMAGE,PORT,DOMAIN,CLUBDUE_DEPLOY_MODE,GHCR_USER,GHCR_TOKEN
          # Preserve the complete Bash program; its own `set -euo pipefail`
          # is the fail-fast boundary (ssh-action's line wrapper breaks case).
          script_stop: false
          script_path: scripts/droplet-deploy.sh

      - name: Smoke test production
        env:
          CLUBDUE_SMOKE_EMAIL: ${{ secrets.CLUBDUE_PRODUCTION_SMOKE_EMAIL }}
          CLUBDUE_SMOKE_PASSWORD: ${{ secrets.CLUBDUE_PRODUCTION_SMOKE_PASSWORD }}
        run: ./scripts/smoke-test.sh production
