name: Deploy Production

# Promote a tested staging image to production. Run only after staging review.
on:
  workflow_dispatch:
    inputs:
      promote_tag:
        description: "GHCR tag to promote (default: staging — the image currently on staging)"
        required: false
        default: staging
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch is not itself approval. Autonomous work leaves this
    # repository variable unset/false, so an accidental dispatch is harmless.
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Promote image to latest
        run: |
          SRC="ghcr.io/wmichelin/clubdue:${{ inputs.promote_tag }}"
          docker pull "$SRC"
          docker tag "$SRC" ghcr.io/wmichelin/clubdue:latest
          docker push ghcr.io/wmichelin/clubdue:latest

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONTAINER: clubdue
          IMAGE: ghcr.io/wmichelin/clubdue:latest
          PORT: "8083"
          DOMAIN: clubdue.michelindigitalmedia.com
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: CONTAINER,IMAGE,PORT,DOMAIN,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script_path: scripts/droplet-deploy.sh

      - name: Smoke test production
        env:
          CLUBDUE_SMOKE_EMAIL: ${{ secrets.CLUBDUE_PRODUCTION_SMOKE_EMAIL }}
          CLUBDUE_SMOKE_PASSWORD: ${{ secrets.CLUBDUE_PRODUCTION_SMOKE_PASSWORD }}
        run: ./scripts/smoke-test.sh production
